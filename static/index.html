<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人直播</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="style.css?v=30">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <button id="hamburger" class="hamburger" aria-label="菜单">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
            </div>
            <span>数字人直播</span>
        </div>

        <div id="drop-zone" class="drop-zone">
            <div class="section">
                <div class="section-label">选择角色</div>
                <div id="category-filter" class="category-filter"></div>
                <div id="avatar-list" class="avatar-grid"></div>
            </div>

            <div id="avatar-info" class="avatar-info hidden">
                <img id="info-avatar-img" class="avatar-info-img" src="" alt="">
                <div class="avatar-info-detail">
                    <div class="avatar-info-name" id="info-avatar-name"></div>
                    <div class="avatar-info-desc" id="info-avatar-desc"></div>
                    <div class="avatar-info-voice" id="info-avatar-voice"></div>
                </div>
                <button id="info-preview-btn" class="info-preview-btn" title="试听声线">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    试听
                </button>
            </div>

            <button id="upload-btn" class="upload-btn">+ 上传自定义角色</button>
            <input type="file" id="upload-input" accept="image/png,image/jpeg,image/webp" hidden>
            <div class="drop-overlay" id="drop-overlay">
                <div class="drop-overlay-text">拖拽图片到此处</div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">生成引擎</div>
            <div class="engine-row">
                <label class="engine-option active" data-engine="sadtalker">
                    <input type="radio" name="engine" value="sadtalker" checked>
                    <span class="engine-name">SadTalker</span>
                    <span class="engine-desc">快速 ~10s</span>
                </label>
                <label class="engine-option" data-engine="musetalk">
                    <input type="radio" name="engine" value="musetalk">
                    <span class="engine-name">MuseTalk</span>
                    <span class="engine-desc">高品质唇形</span>
                </label>
            </div>
        </div>

        <div class="sidebar-status">
            <span id="api-status" class="dot"></span>
            <span id="api-status-text">检查服务...</span>
            <button id="stats-btn" class="stats-btn" title="用量统计">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="8" width="4" height="13"/><rect x="17" y="4" width="4" height="17"/></svg>
            </button>
        </div>
    </aside>

    <main class="main">
        <div class="tabs">
            <button class="tab active" data-mode="direct">
                <span class="tab-title">让 TA 说</span>
                <span class="tab-sub">输入文字，数字人为你朗读</span>
            </button>
            <button class="tab" data-mode="ai">
                <span class="tab-title">问 TA</span>
                <span class="tab-sub">提问题，AI 回答并说出来</span>
            </button>
            <button id="theme-toggle" class="theme-toggle" title="切换主题">
                <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 1 0 21 12.79z"/></svg>
            </button>
        </div>

        <div class="stage">
            <div class="video-wrap" id="video-wrap">
                <video id="video-player" controls autoplay playsinline></video>
                <div id="placeholder" class="placeholder">
                    <div id="scene-templates" class="scene-templates">
                        <div class="scene-card" data-scene="news">
                            <div class="scene-icon">📺</div>
                            <div class="scene-title">新闻播报</div>
                            <div class="scene-desc">专业主播带你看新闻</div>
                        </div>
                        <div class="scene-card" data-scene="teach">
                            <div class="scene-icon">📖</div>
                            <div class="scene-title">课堂教学</div>
                            <div class="scene-desc">教授讲解知识要点</div>
                        </div>
                        <div class="scene-card" data-scene="health">
                            <div class="scene-icon">🩺</div>
                            <div class="scene-title">健康科普</div>
                            <div class="scene-desc">医生普及健康常识</div>
                        </div>
                        <div class="scene-card" data-scene="story">
                            <div class="scene-icon">🌙</div>
                            <div class="scene-title">故事时间</div>
                            <div class="scene-desc">奶奶讲暖心故事</div>
                        </div>
                        <div class="scene-card" data-scene="cook">
                            <div class="scene-icon">🍳</div>
                            <div class="scene-title">美食教程</div>
                            <div class="scene-desc">大厨教你家常菜</div>
                        </div>
                        <div class="scene-card" data-scene="ai">
                            <div class="scene-icon">🤖</div>
                            <div class="scene-title">AI 问答</div>
                            <div class="scene-desc">工程师为你解答疑惑</div>
                        </div>
                    </div>
                </div>
                <div id="loading" class="loading hidden">
                    <div class="step-progress" id="step-progress">
                        <div class="step-dot active" id="step-dot-0"></div>
                        <div class="step-line" id="step-line-0"></div>
                        <div class="step-dot" id="step-dot-1"></div>
                        <div class="step-line" id="step-line-1"></div>
                        <div class="step-dot" id="step-dot-2"></div>
                    </div>
                    <p id="loading-text">生成中...</p>
                    <p id="loading-timer" class="loading-timer"></p>
                </div>
                <span id="time-badge" class="badge hidden"></span>
                <button id="share-btn" class="share-btn hidden" title="分享视频">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </button>
                <button id="download-btn" class="download-btn hidden" title="下载视频">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button id="fullscreen-btn" class="fullscreen-btn hidden" title="全屏播放">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                </button>
            </div>

            <div id="llm-box" class="llm-box hidden">
                <div id="chat-history" class="chat-history"></div>
                <button id="clear-chat-btn" class="clear-chat-btn hidden">清除对话</button>
            </div>

            <div id="samples" class="samples hidden">
                <div class="samples-label" id="samples-label">推荐台词</div>
                <div id="samples-list" class="samples-list"></div>
            </div>

            <div id="history-panel" class="history-panel hidden">
                <div class="section-label">历史记录</div>
                <div id="history-list" class="history-list"></div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrap">
                <textarea id="text-input" placeholder="输入要说的话...（Enter 发送）" rows="1" maxlength="500"></textarea>
                <span id="char-count" class="char-count">0/300</span>
            </div>
            <label class="subtitle-toggle" title="每行一段，回车分隔">
                <input type="checkbox" id="multi-seg-check">
                <span class="subtitle-slider"></span>
                <span class="subtitle-label">多段</span>
            </label>
            <label class="subtitle-toggle" title="为视频添加字幕">
                <input type="checkbox" id="subtitle-check">
                <span class="subtitle-slider"></span>
                <span class="subtitle-label">字幕</span>
            </label>
            <button id="send-btn" disabled>请先选角色</button>
        </div>
    </main>
</div>

<div id="stats-modal" class="stats-modal hidden">
    <div class="stats-modal-content">
        <button id="stats-close" class="stats-close">&times;</button>
        <h3 class="stats-title">用量统计</h3>
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-value" id="stat-total">0</div>
                <div class="stats-label">总生成次数</div>
            </div>
            <div class="stats-card">
                <div class="stats-value" id="stat-today">0</div>
                <div class="stats-label">今日生成</div>
            </div>
            <div class="stats-card">
                <div class="stats-value" id="stat-tts">0</div>
                <div class="stats-label">TTS 调用</div>
            </div>
        </div>
        <div class="stats-section">
            <div class="stats-section-label">热门角色 Top 5</div>
            <div id="stats-top-chars" class="stats-top-chars"></div>
        </div>
    </div>
</div>

<div id="shortcuts-help" class="shortcuts-help" title="键盘快捷键">
    <span class="shortcuts-icon">?</span>
    <div class="shortcuts-tooltip">Ctrl+Enter 生成 · Esc 关闭菜单</div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=30"></script>
</body>
</html>
